name: Auto Organize Algorithm Files

on:
  push:
    branches:
      - ksm
      - jji
      - ish
      - lkh
      - ljh

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ksm_token }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.quotePath false
          git config --global core.precomposeunicode true
      
      - name: Organize files
        run: |
          # 브랜치 이름에 따른 이름 및 PREFIX 매핑
          case "${{ github.ref_name }}" in
            ksm) NAME="김세민"; PREFIX="ksm" ;;
            jji) NAME="장지인"; PREFIX="jji" ;;
            ish) NAME="임성혁"; PREFIX="ish" ;;
            lkh) NAME="이경호"; PREFIX="lkh" ;;
            ljh) NAME="이정헌"; PREFIX="ljh" ;;
            *) echo "Unknown branch"; exit 1 ;;
          esac
          
          # 커밋 날짜로부터 월 계산
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')
          MONTH=$(date -d "$COMMIT_DATE" +%m 2>/dev/null || date -j -f "%Y-%m-%d" "$COMMIT_DATE" +%m)
          
          # 해당 월의 첫 번째 날 계산
          YEAR=$(date -d "$COMMIT_DATE" +%Y 2>/dev/null || date -j -f "%Y-%m-%d" "$COMMIT_DATE" +%Y)
          
          # 주차 계산 (해당 월의 몇 번째 주인지)
          if date --version >/dev/null 2>&1; then
            # GNU date (Linux)
            COMMIT_DAY=$(date -d "$COMMIT_DATE" +%d)
          else
            # BSD date (macOS)
            COMMIT_DAY=$(date -j -f "%Y-%m-%d" "$COMMIT_DATE" +%d)
          fi
          
          # ---------------------------------------------------------
          # [수정됨] 08, 09일 에러 방지를 위해 10진수(10#)로 강제 변환
          # ---------------------------------------------------------
          WEEK=$(( (10#$COMMIT_DAY - 1) / 7 + 1 ))
          
          # 커밋 메시지에서 문제 정보 추출
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "📝 Commit message: $COMMIT_MSG"
          
          # 커밋 메시지 파싱: [플랫폼] 문제번호 문제명 (선택)
          if [[ $COMMIT_MSG =~ \[([A-Z]+)\][[:space:]]+([0-9]+)([[:space:]]+(.+))? ]]; then
            PLATFORM="${BASH_REMATCH[1]}"
            PROBLEM_NUM="${BASH_REMATCH[2]}"
            PROBLEM_NAME="${BASH_REMATCH[4]}"
            
            # 문제명이 있으면 사용, 없으면 빈 문자열
            if [ -n "$PROBLEM_NAME" ]; then
              # 문제명에서 " - 이름" 부분 제거
              PROBLEM_NAME=$(echo "$PROBLEM_NAME" | sed 's/ - .*//')
              FILE_BASE="${PLATFORM}_${PROBLEM_NUM}_${PROBLEM_NAME}"
            else
              FILE_BASE="${PLATFORM}_${PROBLEM_NUM}"
            fi
            
            echo "✅ Parsed: Platform=$PLATFORM, Number=$PROBLEM_NUM, Name=$PROBLEM_NAME"
          else
            echo "ℹ️  Not a problem submission commit (no [PLATFORM] NUMBER format found). Skipping organization."
            exit 0
          fi
          
          # --- AlgoSu 등록 문제 검증 ---
          if [ -z "$PROBLEM_NUM" ]; then
            echo "❌ 오류: 문제 번호를 찾을 수 없습니다."
            exit 1
          fi

          echo "🔍 AlgoSu API 호출하여 활성화된 문제 목록 조회 중..."
          # API 호출 실패 시 {"problems":[]} 기본값 처리하여 중단 방지 (에러 무시)
          API_RES=$(curl -s "https://analyzealgo.leo0409.work/api/problems/active" || echo '{"problems":[]}')
          
          # 응답 형식이 올바르지 않은 경우 기본값으로 처리
          if ! echo "$API_RES" | grep -q '"problems"'; then
            API_RES='{"problems":[]}'
          fi

          # 등록된 문제 번호 추출 (jq 대신 grep과 awk 등을 활용)
          # 추출 후 공백으로 구분된 한 줄 문자열로 생성
          REGISTERED=$(echo "$API_RES" | grep -o '"problemNumber":[0-9]*' | awk -F':' '{print $2}' | tr '\n' ' ' | sed 's/ *$//')
          
          if [ -z "$REGISTERED" ]; then
            echo "⚠️ 이번 주 등록된 문제 목록($REGISTERED)이 비어있거나 불러오지 못했습니다. (exit 0)"
            exit 0
          fi

          # 문제 번호가 포함되어 있는지 확인하기 위해 앞뒤 공백 추가 ( grep -q " $PROBLEM_NUM " 조건 만족 )
          REGISTERED_PADDED=" $REGISTERED "
          if echo "$REGISTERED_PADDED" | grep -q " $PROBLEM_NUM "; then
            echo "✅ 검증 통과: $PROBLEM_NUM 번 문제는 등록된 문제입니다."
          else
            echo "❌ 미등록 문제 오류: 제출한 $PROBLEM_NUM 번 문제는 이번 주 활성화된 문제 목록에 없습니다."
            echo "💡 현재 활성화된 문제 목록: $REGISTERED"
            exit 1
          fi
          # --------------------------------------
          
          # workspace/이름/PREFIX/template 폴더 확인
          WORKSPACE_DIR="workspace/${NAME}"
          TEMPLATE_DIR="${WORKSPACE_DIR}/${PREFIX}/template"
          
          if [ ! -d "$TEMPLATE_DIR" ]; then
            echo "❌ Error: $TEMPLATE_DIR not found"
            exit 1
          fi
          
          # Main.java가 수정되었는지 확인
          MAIN_FILE="${TEMPLATE_DIR}/Main.java"
          if ! git diff --quiet HEAD~1 HEAD -- "$MAIN_FILE"; then
            echo "✅ Main.java has been modified"
          else
            echo "ℹ️  Main.java has not been modified, nothing to organize"
            exit 0
          fi
          
          # 주차 이름 생성
          WEEK_NAME="week${WEEK}"
          TARGET_DIR="${WORKSPACE_DIR}/${MONTH}/${WEEK_NAME}"
          CURRENT_WEEK_DIR="weeklyCode/${MONTH}/${WEEK_NAME}"
          mkdir -p "$TARGET_DIR"
          mkdir -p "$CURRENT_WEEK_DIR"
          
          # Main.java를 파싱된 파일명으로 .md 형식으로 저장
          md_name="${FILE_BASE}.md"
          name_with_member="${FILE_BASE}_${NAME}.md"
          
          # Java 파일 내용을 Markdown 코드 블록으로 변환
          {
            echo '```java'
            cat "$MAIN_FILE"
            echo '```'
          } > "/tmp/${md_name}"
          
          # 월/주차 폴더에 복사
          if [ -f "${TARGET_DIR}/${md_name}" ]; then
            echo "⚠️  File ${md_name} already exists in ${TARGET_DIR}, overwriting..."
          fi
          cp "/tmp/${md_name}" "${TARGET_DIR}/${md_name}"
          echo "✅ Copied ${md_name} to ${TARGET_DIR}"
          
          # weeklyCode 폴더에 이름 포함된 파일명으로 복사
          cp "/tmp/${md_name}" "${CURRENT_WEEK_DIR}/${name_with_member}"
          echo "📋 Copied ${name_with_member} to ${CURRENT_WEEK_DIR}"
          
          echo "🗑️  Solution saved as .md format"
          
          # Main.java 파일 초기화
          MAIN_FILE="${TEMPLATE_DIR}/Main.java"
          if [ -f "$MAIN_FILE" ]; then
            printf "package %s.template;\n\npublic class Main {\n    public static void main(String[] args){\n   \n    }\n}\n" "$PREFIX" > "$MAIN_FILE"
            echo "🔄 Reset Main.java to initial state"
          fi
          
          # Webhook 전송 (JSON 데이터)
          WEBHOOK_URL="https://auto.leo0409.work/webhook/943392e7-ac14-49c8-96ad-3f437e790c29"
          
          # JSON 데이터 생성
          SAFE_PROBLEM_NAME=$(echo "$PROBLEM_NAME" | sed 's/"/\\"/g')
          
          JSON_DATA=$(cat <<EOF
          {
            "name": "$NAME",
            "platform": "$PLATFORM",
            "problemNumber": "$PROBLEM_NUM",
            "problemName": "$SAFE_PROBLEM_NAME",
            "week": "$WEEK",
            "month": "$MONTH"
          }
          EOF
          )
          
          echo "🚀 Sending webhook to $WEBHOOK_URL"
          echo "Payload: $JSON_DATA"
          
          curl -X POST -H "Content-Type: application/json" -d "$JSON_DATA" "$WEBHOOK_URL"
          # 추가 (바로 아래에)
          # curl -s -X POST -H "Content-Type: application/json" -d "$JSON_DATA" "https://auto.leo0409.work/webhook/algostudy-analysis"
          
          # 변경사항이 있는지 확인 및 커밋
          if [ -n "$(git status --porcelain)" ]; then
            git add "$WORKSPACE_DIR/" "weeklyCode/"
            git commit -m "📁 Auto organize: ${NAME} - ${MONTH}월 week${WEEK}"
            
            # main 브랜치로 체크아웃하고 병합
            git fetch origin main
            git checkout main
            git merge --no-ff ${{ github.ref_name }} -m "Merge ${NAME}'s solutions for ${MONTH}월 week${WEEK}"
            git push origin main
            
            echo "✅ Files organized and pushed to main branch"
          else
            echo "ℹ️ No changes to commit"
          fi
